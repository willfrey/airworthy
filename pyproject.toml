[project]
name = "airworthy"
dynamic = ["version"]
description = "Track aircraft write-ups from report to repair, and which aircraft can fly."
readme = "README.md"
authors = [{ name = "Will Frey", email = "jfrey89@gmail.com" }]
# PyPI rejects any upload carrying a `Private ::` classifier, so this package can't be
# published by mistake.
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.15"
dependencies = ["pydantic>=2.14"]

# The version comes from git tags: HEAD tagged `v1.2.0` builds 1.2.0, and any other
# commit builds a development version past the last tag (1.2.1.dev3+g…).
# The build requirements carry no version: uv.lock doesn't hold them, so a build takes
# the newest of each, and a floor would only record a release that was once the newest.
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# Outside a git repository and without an sdist's PKG-INFO (GitHub's source-code
# archive, or the copy of the old template that `copier update` renders to diff
# against), the version is the base an untagged repository counts up from.
fallback-version = "0.0"

# The import name is its own answer, not derived from the distribution name.
[tool.hatch.build.targets.wheel]
packages = ["src/airworthy"]

# The py.typed marker, without which type checkers ignore the wheel's annotations. A
# forced include fails the build when its file is missing, and no exclusion drops it.
[tool.hatch.build.targets.wheel.force-include]
"src/airworthy/py.typed" = "airworthy/py.typed"

[tool.uv]
# Reinstall the project when HEAD or the tags move, so the installed version, which
# importlib.metadata reports, follows git.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
# ty's uv integration, which scripts/check's ty step turns on, needs uv 0.12.3 or later;
# an older uv refuses to run here instead of failing inside ty.
required-version = ">=0.12.3"

# Unversioned here: generation locks the newest of each, uv.lock is the one place a
# version is pinned, and Dependabot (.github/dependabot.yaml) proposes each bump to the
# lock as a PR, so a new lint rule or checker behavior arrives reviewed, never
# mid-change.
# Each type checker carries a floor only: the release its config below was verified
# against, since an older one may not know a key it sets (mypy's `exclude_gitignore`,
# say). Pinning it is the project's call.
[dependency-groups]
dev = [
    "complexipy",
    "deptry",
    "hypothesis",
    "import-linter",
    "mutmut",
    "mypy>=2.4.1",
    "pyrefly>=1.4.0",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "ruff",
    "shellcheck-py",
    "ty>=0.0.95",
    "typos",
    "zizmor",
]

# --- ruff -------------------------------------------------------------------------
[tool.ruff]
# Every rule, preview included, with one reason for each rule left out. Single rules go
# by name: preview's rule-codes-in-selectors (RUF201) rejects a code in this file.
# The target version comes from requires-python.
# Directories of standalone modules, not packages: tests (importlib import mode) and
# the project's scripts.
namespace-packages = ["tests", "scripts"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
preview = true  # name-form `# ruff: ignore[...]` suppressions work only under preview
select = ["ALL"]
# The google convention turns these two off; turn them back on for an imperative
# summary and no "This function…".
extend-select = ["non-imperative-mood", "docstring-starts-with-this"]
ignore = [
    # The one rule the formatter conflicts with (Ruff warns when it's on): the formatter
    # decides where a trailing comma goes.
    "missing-trailing-comma",
    # Each of these would push the code somewhere worse.
    "compare-to-empty-string",            # `not x` conflates "" and None for str | None
    "if-else-block-instead-of-if-exp",    # a ternary hides an untaken arm from branch coverage
    "missing-copyright-notice",           # the license covers the project, not each file
    "suspicious-subprocess-import",       # S603 flags each call, where the reason belongs
]

[tool.ruff.lint.per-file-ignores]
# One decision across the whole test tree, never a per-site acceptance. Each entry rests
# on something only tests do. A helper serves only its own test module, so it is
# `_`-prefixed and, as in src/, needs a docstring only to explain itself; one it has
# meets src/'s docstring rules. Fakes and exceptions meet src/'s rules too.
"**/tests/**" = [
    # A test's name says what it checks. Ruff can't tell a test from another public
    # function, so a public helper is exempt too: name it with a leading `_`.
    "undocumented-public-function",
    "assert",                             # pytest's assertion model
    "magic-value-comparison",             # an expected literal is the point of an assertion
    "too-many-arguments",                 # pytest passes a test its fixtures; no caller does
    "too-many-positional-arguments",
    "hardcoded-password-string",          # a fake credential is a test input
    "hardcoded-password-func-arg",
    "hardcoded-password-default",
    "subprocess-without-shell-equals-true",  # a test runs a command it wrote itself
    "start-process-with-partial-path",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true  # a trivial helper gets one line, no Args/Returns padding

[tool.ruff.lint.flake8-type-checking]
strict = true
# Pydantic reads field annotations at runtime, so their imports must stay real. Add every
# project base model defined in another module: Ruff doesn't follow inheritance across
# modules. model.Model is the starter base a project created with Pydantic begins with.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "airworthy.model.Model",
]
# The base classes cover fields only. Validator and serializer methods have their
# annotations read too, so their decorators are listed, as is every decorator whose function
# a framework introspects (a FastAPI router's `fastapi.APIRouter.get` and friends, say).
runtime-evaluated-decorators = [
    "pydantic.field_validator",
    "pydantic.model_validator",
    "pydantic.field_serializer",
    "pydantic.model_serializer",
    "pydantic.validate_call",
    "pydantic.dataclasses.dataclass",
]

# The last two keep a test from importing another test module or a conftest: tests
# share code through fixtures. Ruff resolves a relative import in tests/ to `tests.…`,
# so the `tests` ban catches that form too.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "PEP 649 makes annotations lazy on 3.14+; remove the import."
"unittest.mock.patch".msg = "Pass the collaborator as a parameter instead of patching the module that uses it."
"tests".msg = "Tests don't import tests: share code through a fixture, or define the helper in the module that uses it."
"conftest".msg = "Nothing imports a conftest: take what it provides as a fixture."

[tool.ruff.lint.flake8-pytest-style]
# Any field failure raises ValidationError, so an unmatched pytest.raises passes on the
# wrong field.
raises-extend-require-match-for = ["pydantic.ValidationError"]

[tool.ruff.lint.pylint]
allow-dunder-method-names = [
    "__get_pydantic_core_schema__",
    "__get_pydantic_json_schema__",
    "__pydantic_init_subclass__",
]

[tool.ruff.lint.isort]
combine-as-imports = true

# --- mypy -------------------------------------------------------------------------
[tool.mypy]
python_version = "3.15"
# CI's platform, so a check on a Mac gives CI's verdict: checking against the machine it
# runs on, mypy would reject `os.sched_getaffinity()` on a Mac, which CI's Linux has.
platform = "linux"
# From the root, skipping what .gitignore does, as ty and pyrefly do by default:
# otherwise mypy checks mutmut's mutated copy under mutants/ and fails on it. It is no
# duplicate module: explicit_package_bases names it mutants.src.airworthy.
files = ["."]
exclude_gitignore = true
# Name each module by its path from src/ or the root, so two files of one name in
# different directories (a second conftest.py, tests mirroring src/) are two modules.
explicit_package_bases = true
mypy_path = "src"
strict = true
# An unannotated variable assigned in several branches takes the union of what they
# assign, as ty infers it, rather than the first branch's type.
allow_redefinition = true
warn_unreachable = true
strict_equality_for_none = true
show_error_code_links = true
# Flag-backed codes: listing them in enable_error_code would activate nothing.
disallow_any_explicit = true
disallow_any_unimported = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
# PreciseTupleTypes, a feature mypy calls unfinished, narrows a tuple[T, ...] on len()
# and truthiness, so `not items` leaves tuple[()] and `items[0]` fails.
enable_incomplete_feature = ["PreciseTupleTypes"]
# Without the plugin, mypy rejects every model class under disallow_any_explicit and
# misses an assignment to a frozen field.
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# The package's own code holds no Any: each Any a library's types bring in is cast once,
# in the wrapper that owns that library (AGENTS.md). Tests and scripts call libraries
# directly, and keep the types they give. The pattern takes in the package itself too.
[[tool.mypy.overrides]]
module = "airworthy.*"
disallow_any_expr = true
disallow_any_decorated = true

# --- ty ---------------------------------------------------------------------------
# Every rule on, missing-direct-dependency included: scripts/check's ty step gives it
# uv's dependency graph. mypy stays in the gate: at the floor in [dependency-groups], ty
# reports no unreachable code, redundant `self` or expression, `is None` on a type that
# can't be None, test of an object that is always true, unannotated def, discarded
# awaitable, explicit Any, implicit re-export, `==` between unrelated types or
# non-exhaustive match.
[tool.ty.environment]
# CI's platform, as for mypy.
python-platform = "linux"

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
# isinstance(x, list) narrows to list[object], where mypy gives list[Any].
strict-generic-narrowing = true
# `x == "a"` leaves an `int | str` as it is, where the default narrows it to `str`.
strict-equality-semantics = true
# ty reads no `# type: ignore`, even one naming a ty rule, so `# ty: ignore[<rule>]` is
# its only way past.
respect-type-ignore-comments = false

# --- pyrefly ----------------------------------------------------------------------
# Every rule on but implicit-bool. mypy stays in the gate: at the floor in
# [dependency-groups], pyrefly reports no unreachable code, redundant `self` or
# expression, `is None` on a type that can't be None, or test of an object that is
# always true.
[tool.pyrefly]
# pyrefly doesn't read requires-python: it takes the interpreter's version, which is
# the dev interpreter (.python-version), not the floor.
python-version = "3.15"
# CI's platform, as for mypy.
python-platform = "linux"
preset = "all"
# A module-level name in capitals is a constant: assigning it again is an error, as for
# one marked Final.
treat-all-caps-as-final = true
# `xs = []` needs its item type written, rather than taking it from the first append.
infer-with-first-use = false
# pyrefly would let any `# type: ignore` silence it, whatever mypy code the comment
# names.
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
# It rejects every implicit truth test, `if items:` included, which PEP 8 recommends
# for a sequence. mypy's truthy-bool and truthy-iterable catch the tests that are
# always true, and ty's truthiness-test-of-none-union an Optional's.
implicit-bool = false
# A reveal_type left in fails the check, where by default it only prints the type.
reveal-type = "error"

# --- pytest and coverage ----------------------------------------------------------
[tool.pytest.ini_options]
# importlib mode: tests have no __init__.py, and same-named test files in different
# directories don't collide. Markers are strict; tests/conftest.py registers the
# surface markers and requires exactly one per test.
addopts = [
    # Not last: pytest puts addopts before the command line's arguments, and --cov
    # takes an optional value, so a final --cov would take a test path given first
    # (`pytest tests/test_x.py`) as the source to measure, and the whole suite would
    # run.
    "--cov",
    "--import-mode=importlib",
]
# mutmut runs these too, from its copy of the project under mutants/. It copies tests/
# and test/ there but no other directory: any other added here also goes in
# [tool.mutmut] also_copy.
testpaths = ["tests"]
# An unregistered marker, a duplicated parametrize ID and an xfail that passes each fail
# the run. An unknown config key fails it too, here and through filterwarnings.
strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["airworthy"]

[tool.coverage.report]
fail_under = 100
skip_covered = true
show_missing = true
# Lines that can't run by construction, and nothing else: a TYPE_CHECKING block, an
# overload, a stub and an assert_never arm. A stub is a def, or the last line of one,
# ending in `...`, or a `...` right after a docstring, which Ruff allows only in a
# Protocol or an abstract method. Each pattern matches from the start of a statement, so
# a comment can't act as a pragma, and a `...` body under an `if` or `case` still has to
# run. exclude_lines and partial_branches replace coverage's defaults, which would also
# let `# pragma: no cover` and `# pragma: no branch` past the gate.
exclude_lines = [
    '^\s*if (typing\.)?TYPE_CHECKING:',
    '^\s*@(typing\.)?overload\b',
    '^\s*((async )?def .*?)?[\])]+(\s*->.*?)?:\s*\.\.\.\s*(#|$)',
    '^\s*(typing\.)?assert_never\(',
    '"""\s*\n\s*\.\.\.\s*(#|$)',
]
partial_branches = []

# --- complexity -------------------------------------------------------------------
[tool.complexipy]
max-complexity-allowed = 15
# complexipy needs a path; from the root it skips what .gitignore does.
paths = ["."]
# The committed complexipy-snapshot.json is the only sanctioned suppression; inline
# `# complexipy: ignore` comments are not honored.
no-ignore = true

# --- import boundaries ------------------------------------------------------------
# Every top-level module of src/airworthy/ is listed in `layers`, highest
# first; lint-imports names any that isn't. See AGENTS.md. model, the base a new
# project's Pydantic models start from, is optional, so a project without it passes.
[tool.importlinter]
root_package = "airworthy"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
containers = ["airworthy"]
layers = ["writeup", "(model)"]
exhaustive = true

# --- mutation testing -------------------------------------------------------------
# Run with scripts/mutation (in CI, .github/workflows/mutation.yaml), which fails on
# any mutant the tests don't catch. `# pragma: no mutate` on a line is the only
# suppression.
[tool.mutmut]
# Named, because mutmut's guess takes a lib/ directory over src/.
source_paths = ["src/airworthy/"]
# mutmut runs a pytest session per mutant, in parallel. Sessions sharing pytest's
# temporary root race each other's cleanup of it, and a session that fails that way
# counts its mutant as killed when no test detected it. basetemp_per_session gives each
# session a root of its own (tests/conftest.py). no:randomly fixes the test order, so a
# mutant's verdict repeats; mutmut 3.8 passes it too, but doesn't document doing so.
pytest_add_cli_args = [
    "-p",
    "no:randomly",
    "-o",
    "basetemp_per_session=true",
    "--no-cov",
]
# Skip the lines coverage leaves out (exclude_lines above): no test can reach them.
mutate_only_covered_lines = true
# A mutant mypy rejects can't pass scripts/check, so it is caught without a test. mutmut
# runs this in mutants/, over this config, and stops at an error outside every mutant
# (boxed/mutmut#638). Its generated code carries `# type: ignore` comments that are
# unused wherever a mutant type-checks, and a decorator line whose type holds Any, which
# the package's Any bans report as misc. A mutant mypy rejects only as misc goes to the
# tests instead.
type_check_command = [
    "mypy",
    "src",
    "--output",
    "json",
    "--no-warn-unused-ignores",
    "--disable-error-code",
    "misc",
]
